<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Tower Room Service</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-body: #0d0d0d;
      --card-bg: #1a1a1a;
      --text-main: #ffffff;
      --accent: #ff9800;
      --border-color: #2a2a2a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-body);
      color: var(--text-main);
      padding: 20px 20px 100px 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 22px;
      color: var(--accent);
    }

    .room-block {
      background: var(--card-bg);
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      border: 1px solid var(--border-color);
    }

    .room-block label {
      display: block;
      font-size: 14px;
      margin-bottom: 8px;
      color: #aaa;
    }

    .room-block input {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: #111;
      color: #fff;
      font-size: 16px;
    }

    .menu-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .item-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .item-info h3 {
      font-size: 16px;
      margin-bottom: 4px;
    }

    .item-price {
      color: var(--accent);
      font-weight: bold;
      font-size: 14px;
    }

    .add-btn {
      background: var(--accent);
      border: none;
      color: #000;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Cart Bar */
    .cart-bar {
      position: fixed;
      bottom: 20px;
      left: 20px;
      right: 20px;
      background: var(--accent);
      color: #000;
      padding: 15px 20px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      justify-content: center;
      align-items: center;
      z-index: 999;
      padding: 20px;
    }

    .modal-body {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      border: 1px solid var(--border-color);
    }

    .cart-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-color);
    }

    .qty-controls button {
      background: #333;
      color: #fff;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 4px;
      font-weight: bold;
    }

    .submit-btn {
      width: 100%;
      background: var(--accent);
      color: #000;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      margin-top: 15px;
      cursor: pointer;
      font-size: 16px;
    }

    .close-btn {
      width: 100%;
      background: transparent;
      color: #888;
      padding: 8px;
      border: none;
      margin-top: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>The Tower Room Service</h1>
  </div>

  <div class="room-block">
    <label for="roomInput">Номер комнаты:</label>
    <input type="text" id="roomInput" value="101" placeholder="Введите номер комнаты">
  </div>

  <div class="menu-list">
    <div class="item-card">
      <div class="item-info">
        <h3>Pumpkin Soup</h3>
        <div class="item-price">50 000 UZS</div>
      </div>
      <button class="add-btn" onclick="addToCart('Pumpkin Soup', 50000)">+</button>
    </div>

    <div class="item-card">
      <div class="item-info">
        <h3>Club Sandwich</h3>
        <div class="item-price">75 000 UZS</div>
      </div>
      <button class="add-btn" onclick="addToCart('Club Sandwich', 75000)">+</button>
    </div>

    <div class="item-card">
      <div class="item-info">
        <h3>Fresh Orange Juice</h3>
        <div class="item-price">35 000 UZS</div>
      </div>
      <button class="add-btn" onclick="addToCart('Fresh Orange Juice', 35000)">+</button>
    </div>
  </div>

  <!-- Bottom Bar -->
  <div class="cart-bar" id="cartBar" style="display: none;" onclick="openModal()">
    <span>Заказ (<span id="cartCount">0</span>)</span>
    <span id="cartTotal">0 UZS</span>
  </div>

  <!-- Modal -->
  <div class="modal" id="orderModal">
    <div class="modal-body">
      <h2 style="margin-bottom: 15px; font-size: 18px;">Детали заказа</h2>
      <div id="modalItems"></div>
      <div style="margin-top: 15px; font-size: 18px; font-weight: bold;">
        Итого: <span id="modalTotalSum">0 UZS</span>
      </div>
      <button class="submit-btn" id="sendBtn" onclick="sendOrder()">Подтвердить заказ</button>
      <button class="close-btn" onclick="closeModal()">Закрыть</button>
    </div>
  </div>

<script>
  const WORKER_URL = "https://solitary-frog-ffbc.thetowerroomservice.workers.dev";
  const tg = window.Telegram?.WebApp;
  if (tg) tg.ready();

  let cart = [];

  function addToCart(name, price) {
    const item = cart.find(i => i.name === name);
    if (item) {
      item.qty++;
    } else {
      cart.push({ name, price, qty: 1 });
    }
    updateUI();
  }

  function changeQty(name, delta) {
    const item = cart.find(i => i.name === name);
    if (item) {
      item.qty += delta;
      if (item.qty <= 0) {
        cart = cart.filter(i => i.name !== name);
      }
    }
    updateUI();
    renderModalItems();
  }

  function updateUI() {
    const totalCount = cart.reduce((sum, item) => sum + item.qty, 0);
    const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

    const cartBar = document.getElementById('cartBar');
    document.getElementById('cartCount').innerText = totalCount;
    document.getElementById('cartTotal').innerText = totalPrice.toLocaleString() + " UZS";

    if (totalCount > 0) {
      cartBar.style.display = 'flex';
    } else {
      cartBar.style.display = 'none';
      closeModal();
    }
  }

  function openModal() {
    if (cart.length === 0) return;
    renderModalItems();
    document.getElementById('orderModal').style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('orderModal').style.display = 'none';
  }

  function renderModalItems() {
    const container = document.getElementById('modalItems');
    container.innerHTML = '';
    let total = 0;

    cart.forEach(item => {
      const sum = item.price * item.qty;
      total += sum;
      container.innerHTML += `
        <div class="cart-line">
          <div>
            <div><b>${item.name}</b></div>
            <div style="font-size: 12px; color: #aaa;">${item.price.toLocaleString()} UZS</div>
          </div>
          <div class="qty-controls">
            <button onclick="changeQty('${item.name}', -1)">-</button>
            <span style="margin: 0 8px;">${item.qty}</span>
            <button onclick="changeQty('${item.name}', 1)">+</button>
          </div>
        </div>
      `;
    });

    document.getElementById('modalTotalSum').innerText = total.toLocaleString() + " UZS";
  }

  async function sendOrder() {
    const roomNumber = document.getElementById('roomInput').value.trim() || 'Не указан';
    const sendBtn = document.getElementById('sendBtn');
    
    if (cart.length === 0) return;

    sendBtn.disabled = true;
    sendBtn.innerText = "Отправка...";

    let itemsText = "";
    let total = 0;

    cart.forEach((item, index) => {
      const sum = item.price * item.qty;
      total += sum;
      itemsText += `${index + 1}. ${item.name} x${item.qty} — ${sum.toLocaleString()} UZS\n`;
    });

    const orderText = `🍽 <b>НОВЫЙ ЗАКАЗ ИЗ МЕНЮ</b>\n🏨 <b>Номер комнаты:</b> ${roomNumber}\n\n📋 <b>Состав заказа:</b>\n${itemsText}\n💰 <b>Итого:</b> ${total.toLocaleString()} UZS\n⏳ <b>Статус:</b> Ожидает доставки`;

    const username = tg?.initDataUnsafe?.user?.username 
      ? `@${tg.initDataUnsafe.user.username}` 
      : (tg?.initDataUnsafe?.user?.first_name || 'Гость');

    try {
      const response = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          text: orderText,
          username: username
        })
      });

      const result = await response.json();

      if (result.success || result.ok) {
        alert("Заказ успешно отправлен!");
        cart = [];
        updateUI();
        closeModal();
      } else {
        alert("Ошибка отправки: " + (result.error || "Попробуйте позже"));
      }
    } catch (err) {
      console.error(err);
      alert("Ошибка подключения к серверу.");
    } finally {
      sendBtn.disabled = false;
      sendBtn.innerText = "Подтвердить заказ";
    }
  }
</script>
</body>
</html>
