<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>The Tower Hotel — Room Service</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    // Жёсткая блокировка зума (страховка поверх meta viewport для Android/WebView)
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
    document.addEventListener('gesturechange', function (e) { e.preventDefault(); }, { passive: false });
    document.addEventListener('touchmove', function (e) {
      if (e.touches && e.touches.length > 1) e.preventDefault();
    }, { passive: false });
    (function () {
      var lastTouchEnd = 0;
      var lastX = 0, lastY = 0;
      document.addEventListener('touchend', function (e) {
        var now = Date.now();
        var t = e.changedTouches && e.changedTouches[0];
        var x = t ? t.clientX : 0;
        var y = t ? t.clientY : 0;
        var sameSpot = Math.abs(x - lastX) < 30 && Math.abs(y - lastY) < 30;
        if (now - lastTouchEnd <= 350 && sameSpot) e.preventDefault();
        lastTouchEnd = now;
        lastX = x; lastY = y;
      }, { passive: false });
    })();

    // Блокировка зума колесом мыши с Ctrl (desktop) и клавиатурой (Ctrl +/-/0)
    document.addEventListener('wheel', function (e) {
      if (e.ctrlKey) e.preventDefault();
    }, { passive: false });
    document.addEventListener('keydown', function (e) {
      if ((e.ctrlKey || e.metaKey) && ['+', '-', '=', '0'].includes(e.key)) {
        e.preventDefault();
      }
    });
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0d11;
      --surface: #14171e;
      --elevated: #1c2028;
      --fg: #f3eee6;
      --muted: #9b958c;
      --accent: #e6ddd0;
      --accent-fg: #0b0d11;
      --border: rgba(243,238,230,.12);
      --danger: #c45b4a;
      --shadow: 0 18px 50px rgba(0,0,0,.35);
      --sans: "Manrope", system-ui, sans-serif;
      --display: "Cormorant Garamond", Georgia, serif;
      --r-sm: 8px;
      --r-md: 12px;
      --r-lg: 20px;
      --r-xl: 28px;
    }
    html[data-theme="light"] {
      --bg: #f3eee6;
      --surface: #fffdf9;
      --elevated: #ebe4d8;
      --fg: #161410;
      --muted: #6f6a63;
      --accent: #1c1a16;
      --accent-fg: #f3eee6;
      --border: rgba(22,20,16,.12);
      --danger: #a33b2c;
      --shadow: 0 18px 40px rgba(22,20,16,.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { min-height: 100%; background: var(--elevated); color: var(--fg); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
    button { font-family: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    input, textarea, select { font-family: inherit; color: var(--fg); background: var(--elevated); border: 1px solid var(--border); border-radius: var(--r-md); min-height: 44px; width: 100%; padding: 10px 12px; outline: none; font-size: 16px; }
    textarea { min-height: 96px; resize: none; }
    img { max-width: 100%; display: block; }
    .app { max-width: 430px; margin: 0 auto; min-height: 100dvh; background: var(--bg); position: relative; box-shadow: var(--shadow); }
    .top-chrome { position: absolute; inset: max(.5rem, env(safe-area-inset-top)) 12px auto; z-index: 30; display: flex; justify-content: space-between; }
    .chip, .icon-btn {
      min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 0 14px; border-radius: 999px; border: 1px solid var(--border); background: color-mix(in oklab, var(--bg) 55%, transparent); backdrop-filter: blur(12px); font-size: 14px; font-weight: 500;
    }
    .icon-btn { width: 44px; padding: 0; }
    .lang-menu { position: absolute; top: 58px; left: 12px; z-index: 40; width: 200px; max-height: 320px; overflow: auto; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow); }
    [dir="rtl"] .lang-menu { left: auto; right: 12px; }
    .lang-opt { display: flex; justify-content: space-between; width: 100%; padding: 10px 12px; font-size: 14px; color: var(--muted); }
    .lang-opt.on { background: var(--elevated); color: var(--fg); }
    .hero { position: relative; height: 320px; overflow: hidden; border-radius: 0 0 var(--r-xl) var(--r-xl); }
    .hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .7s ease; }
    .hero img.on { opacity: 1; }
    .hero-grad { position: absolute; inset: 0; background: linear-gradient(to top, var(--bg) 8%, color-mix(in oklab, var(--bg) 45%, transparent) 50%, transparent 78%); }
    .hero-copy { position: absolute; left: 20px; right: 20px; bottom: 22px; }
    .eyebrow { font-size: 11px; letter-spacing: .28em; text-transform: uppercase; color: color-mix(in oklab, var(--accent) 80%, transparent); font-weight: 500; }
    h1 { font-family: var(--display); font-size: 52px; font-weight: 500; line-height: .95; letter-spacing: -.03em; }
    .tagline { margin-top: 8px; font-size: 14px; color: var(--muted); }
    .room-chip { margin-top: 16px; display: inline-flex; min-height: 44px; align-items: center; padding: 0 16px; border-radius: 999px; border: 1px solid var(--border); background: color-mix(in oklab, var(--bg) 50%, transparent); backdrop-filter: blur(10px); font-size: 14px; }
    .room-chip span { color: var(--muted); margin-right: 8px; }
    .dots { position: absolute; right: 20px; bottom: 12px; display: flex; gap: 6px; }
    .dots b { width: 6px; height: 6px; border-radius: 99px; background: color-mix(in oklab, var(--fg) 35%, transparent); display: block; }
    .dots b.on { width: 20px; background: var(--accent); }
    .pad { padding: 20px 16px 140px; }
    .wifi { width: 100%; display: flex; align-items: center; gap: 16px; text-align: start; padding: 16px; border: 1px solid var(--border); background: var(--surface); border-radius: var(--r-lg); }
    .ico { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: var(--r-md); background: var(--elevated); flex-shrink: 0; }
    .wifi strong { display: block; font-size: 14px; }
    .wifi small { color: var(--muted); font-size: 12px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
    .feat { position: relative; min-height: 148px; overflow: hidden; border-radius: var(--r-lg); text-align: start; color: #f3eee6; }
    .feat.wide { grid-column: 1 / -1; min-height: 160px; }
    .feat img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .feat .shade { position: absolute; inset: 0; background: linear-gradient(to top, rgba(11,13,17,.92), rgba(11,13,17,.2), transparent); }
    .feat .lbl { position: absolute; left: 12px; bottom: 12px; display: flex; align-items: center; gap: 8px; font-family: var(--display); font-size: 26px; line-height: 1; }
    .svc { min-height: 112px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; text-align: start; padding: 16px; background: var(--surface); border-radius: var(--r-lg); }
    .svc span { font-size: 14px; font-weight: 500; line-height: 1.3; }
    .hidden { display: none !important; }
    .menu-head { position: sticky; top: 0; z-index: 20; padding: max(.75rem, env(safe-area-inset-top)) 12px 12px; background: color-mix(in oklab, var(--bg) 90%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
    .menu-head .row { display: flex; align-items: center; gap: 4px; }
    .menu-head h2 { font-family: var(--display); font-size: 26px; font-weight: 500; }
    .cats { display: flex; gap: 8px; overflow-x: auto; margin-top: 12px; scrollbar-width: none; }
    .cats::-webkit-scrollbar { display: none; }
    .cat { flex-shrink: 0; padding: 8px 14px; border-radius: 999px; background: var(--surface); color: var(--muted); font-size: 14px; }
    .cat.on { background: var(--accent); color: var(--accent-fg); }
    .list { padding: 16px 16px 140px; display: flex; flex-direction: column; gap: 10px; }
    .group { font-family: var(--display); font-size: 22px; margin: 10px 0 4px; }
    .sub { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 8px 0 4px; }
    .item { display: flex; gap: 12px; padding: 10px; background: var(--surface); border-radius: var(--r-lg); }
    .item img, .ph { width: 96px; height: 96px; object-fit: cover; border-radius: var(--r-md); background: var(--elevated); flex-shrink: 0; }
    .item h3 { font-size: 14px; font-weight: 500; line-height: 1.3; }
    .item .bot { margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; }
    .price { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .qty { display: inline-flex; height: 44px; align-items: center; border-radius: 999px; background: var(--elevated); }
    .qty button, .add { width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; }
    .add { width: 44px; height: 44px; background: var(--accent); color: var(--accent-fg); }
    .qty b { min-width: 22px; text-align: center; font-size: 14px; font-variant-numeric: tabular-nums; }
    .cart { position: fixed; left: 50%; transform: translateX(-50%); bottom: 84px; width: min(398px, calc(100% - 32px)); z-index: 35; display: none; min-height: 56px; align-items: center; justify-content: space-between; padding: 0 20px; border-radius: 999px; background: var(--accent); color: var(--accent-fg); box-shadow: var(--shadow); font-size: 14px; font-weight: 500; }
    .cart.show { display: flex; }
    .sheet { position: fixed; inset: 0; z-index: 50; display: none; }
    .sheet.open { display: block; }
    .sheet .ov { position: absolute; inset: 0; background: color-mix(in oklab, var(--bg) 60%, transparent); backdrop-filter: blur(6px); }
    .sheet .box { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); width: min(430px, 100%); max-height: 88dvh; overflow: auto; background: var(--surface); border: 1px solid var(--border); border-bottom: 0; border-radius: var(--r-xl) var(--r-xl) 0 0; padding: 12px 20px max(24px, env(safe-area-inset-bottom)); }
    .handle { width: 40px; height: 4px; border-radius: 99px; background: var(--border); margin: 4px auto 12px; }
    .sheet h2 { font-family: var(--display); font-size: 28px; font-weight: 500; margin-bottom: 14px; }
    .field { display: block; margin-bottom: 14px; }
    .field > span { display: flex; justify-content: space-between; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
    .btn { width: 100%; min-height: 48px; border-radius: var(--r-lg); background: var(--accent); color: var(--accent-fg); font-size: 16px; font-weight: 600; }
    .btn.ghost { background: transparent; border: 1px solid var(--border); color: var(--fg); margin-top: 10px; }
    .btn:disabled { opacity: .5; }
    .toast { position: fixed; left: 50%; top: max(16px, env(safe-area-inset-top)); transform: translateX(-50%) translateY(-20px); z-index: 80; background: var(--surface); border: 1px solid var(--border); color: var(--fg); padding: 12px 16px; border-radius: 999px; opacity: 0; pointer-events: none; transition: .25s ease; font-size: 14px; }
    .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
    .load { position: fixed; inset: 0; z-index: 90; display: none; align-items: center; justify-content: center; background: color-mix(in oklab, var(--bg) 70%, transparent); }
    .load.on { display: flex; }
    .spin { width: 36px; height: 36px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 99px; animation: sp .8s linear infinite; }
    @keyframes sp { to { transform: rotate(360deg); } }
    .wifi-box { background: var(--elevated); border-radius: var(--r-lg); padding: 16px; margin-bottom: 14px; }
    .wifi-box small { display: block; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
    .wifi-box p { margin: 4px 0 12px; font-size: 18px; font-weight: 500; }
    .wifi-box .pw { font-family: var(--display); font-size: 32px; letter-spacing: .04em; }
    .stars { display: flex; justify-content: center; gap: 4px; margin: 8px 0 16px; }
    .stars button { width: 44px; height: 44px; font-size: 28px; color: var(--muted); }
    .stars button.on { color: var(--accent); }
    .line { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .line img { width: 56px; height: 56px; object-fit: cover; border-radius: var(--r-sm); background: var(--elevated); }
    .line .nm { font-size: 14px; font-weight: 500; }
    .tot { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid var(--border); padding-top: 14px; margin: 8px 0 14px; }
    .tot b { font-family: var(--display); font-size: 26px; font-weight: 500; font-variant-numeric: tabular-nums; }
    .muted { color: var(--muted); font-size: 14px; line-height: 1.5; margin-bottom: 14px; }
    .dial { font-family: var(--display); font-size: 36px; margin-bottom: 16px; }
    .empty { text-align: center; color: var(--muted); padding: 48px 16px; }
    .clear { width: 100%; padding: 12px; color: var(--muted); font-size: 14px; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  </style>
</head>
<body>
  <div class="app">
    <div class="top-chrome" id="homeChrome">
      <button class="chip" id="langBtn">RU</button>
      <button class="icon-btn" id="themeBtn" aria-label="theme">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      </button>
    </div>
    <div class="lang-menu hidden" id="langMenu"></div>

    <section id="home">

        <img class="on" src="./images/balcony.jpg" alt="">

        <img src="./images/image.png" alt="">
        <img src="./images/balcony2.jpg" alt="">
        <div class="hero-grad"></div>
        <div class="hero-copy">
          <p class="eyebrow">The Tower Hotel</p>
          <h1>The Tower</h1>
          <p class="tagline" data-i18n="tagline">Сервис в номер</p>

          <span><strong data-i18n="wifi_title">Бесплатный Wi-Fi</strong><small data-i18n="wifi_subtitle">Нажмите, чтобы получить пароль</small></span>

          <button class="svc" data-open="reception"><span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg></span><span data-i18n="service_reception">Ресепшн</span></button>
          <button class="svc" data-open="problem"><span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></span><span data-i18n="service_problem">Проблема</span></button>
          <button class="svc" data-open="alarm"><span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M5 3 2 6M22 6l-3-3"/></svg></span><span data-i18n="service_alarm">Будильник</span></button>

        </div>
      </div>

    <section id="menuScreen" class="hidden">
      <div class="menu-head">
        <div class="row">
          <button class="icon-btn" id="backBtn" aria-label="back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
          <div style="flex:1">
            <h2 id="menuTitle">Меню еды</h2>

      <div class="list" id="menuList"></div>

  </div>

  <div class="toast" id="toast"></div>
  <div class="load" id="load"><div class="spin"></div></div>

  <div class="sheet" id="sheet-wifi"><div class="ov"></div><div class="box"><div class="handle"></div><h2>Wi-Fi</h2><div class="wifi-box"><small data-i18n="wifi_network">Сеть</small><p>The Tower Hotel</p><small data-i18n="wifi_password">Пароль</small><div class="pw" id="wifiPass">Tower2023</div></div><button class="btn" id="copyWifi" data-i18n="wifi_copy">Скопировать</button></div></div>

  const keys = barOnly ? ["bar", ...BAR] : ["all", "bar", ...FOOD];

    const label = barOnly

  }).join("");

function qtyBlock(id, qty) {
  if (!qty) return `<button class="add" data-add="${id}">+</button>`;
  return `<div class="qty"><button data-d="${id}" data-v="-1">−</button><b>${qty}</b><button data-d="${id}" data-v="1">+</button></div>`;
}
function itemCard(item) {
  const q = (cart.find(c => c.id === item.id) || {}).qty || 0;
  const img = item.img ? `<img src="${item.img}" alt="" onerror="this.style.opacity=0">` : `<div class="ph"></div>`;
  return `<article class="item">${img}<div style="flex:1;display:flex;flex-direction:column"><h3>${item.name}</h3><div class="bot"><span class="price">${money(item.price)}</span>${qtyBlock(item.id,q)}</div></div></article>`;
}

function renderMenu() {

    html += `<div class="group">${t("bar_group_non_alcohol")}</div>`;
    BAR_SOFT.forEach(cat => {
      const items = dbMenu.filter(i => i.cat === cat);
      if (!items.length) return;
      html += `<div class="sub">${t("bar_type_"+cat)}</div>` + items.map(itemCard).join("");
    });
    html += `<div class="group">${t("bar_group_alcohol")}</div>`;

      closeSheets();
      if (onOk) onOk();
    } else toast("Ошибка отправки.");
  } catch (e) {
    toast("Ошибка сети.");
  } finally { loading(false); }
}

function logOrder(total, note) {
  fetch(SUPABASE_URL + "/rest/v1/orders", {
    method: "POST",
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: "Bearer " + SUPABASE_KEY,
      "Content-Type": "application/json",
      Prefer: "return=minimal"
    },
    body: JSON.stringify({
      room_number: room(),
      username: guestName(),
      total_sum: total,
      items: cart.map(i => ({id:i.id, name:i.name, price:i.price, qty:i.qty})),
      note: note || null
    })
  }).catch(() => {});
}

document.getElementById("hkMaids").onclick = () => postData(`🧹 <b>HOUSEKEEPING</b>\n🏨 <b>Номер комнаты:</b> ${room()}\n📌 <b>Действие:</b> Позвать горничных\n🌐 <b>Язык интерфейса:</b> ${currentLang.toUpperCase()}`);
document.getElementById("hkClean").onclick = () => postData(`🧹 <b>HOUSEKEEPING</b>\n🏨 <b>Номер комнаты:</b> ${room()}\n📌 <b>Действие:</b> Убраться в моем номере\n🌐 <b>Язык интерфейса:</b> ${currentLang.toUpperCase()}`);
document.getElementById("callReception").onclick = () => postData(`📞 <b>ВЫЗОВ РЕСЕПШЕНА</b>\n🏨 <b>Номер комнаты:</b> ${room()}\n☎️ <b>Запрос на номер:</b> 1111\n🌐 <b>Язык интерфейса:</b> ${currentLang.toUpperCase()}`);
document.getElementById("sendAlarm").onclick = () => {
  const time = document.getElementById("alarmTime").value;
  const date = document.getElementById("alarmDate").value;
  const note = document.getElementById("alarmNote").value.trim();
  if (!time || !date) return toast("Укажите время и дату.");
  postData(`⏰ <b>ЗАПРОС БУДИЛЬНИКА</b>\n🏨 <b>Номер комнаты:</b> ${room()}\n📅 <b>Дата:</b> ${date}\n🕒 <b>Время:</b> ${time}\n📝 <b>Заметка:</b> ${note || "Без примечания"}\n🌐 <b>Язык интерфейса:</b> ${currentLang.toUpperCase()}`, note);
};
document.getElementById("sendTaxi").onclick = () => {
  const dest = document.getElementById("taxiDest").value.trim();
  const date = document.getElementById("taxiDate").value;
  const time = document.getElementById("taxiTime").value || "Ближайшее";
  const pax = document.getElementById("taxiPassengers").value;
  postData(`🚖 <b>ЗАКАЗ ТАКСИ</b>\n🏨 <b>Номер комнаты:</b> ${room()}\n📍 <b>Направление:</b> ${dest || "Не указано"}\n📅 <b>Дата:</b> ${date}\n🕒 <b>Время подачи:</b> ${time}\n👥 <b>Пассажиров:</b> ${pax}\n🌐 <b>Язык интерфейса:</b> ${currentLang.toUpperCase()}`, dest);
};
document.getElementById("stars").innerHTML = [1,2,3,4,5].map(n => `<button data-s="${n}">★</button>`).join("");
document.getElementById("stars").onclick = (e) => {
  const s = e.target.closest("button"); if (!s) return;
  rating = +s.dataset.s;
  [...document.getElementById("stars").children].forEach((b,i) => b.classList.toggle("on", i < rating));
};
document.getElementById("sendReview").onclick = () => {
  if (!rating) return toast(t("select_stars_warn"));
  const comment = document.getElementById("reviewComment").value.trim();
  const starsStr = "★".repeat(rating) + "☆".repeat(5-rating);
  postData(`⭐ <b>НОВЫЙ ОТЗЫВ</b>\n🏨 <b>Номер комнаты:</b> ${room()}\n🌟 <b>Оценка:</b> ${starsStr} (${rating}/5)\n💬 <b>Отзыв:</b> ${comment || "Без комментария"}\n🌐 <b>Язык интерфейса:</b> ${currentLang.toUpperCase()}`, comment);
};
document.getElementById("sendProblem").onclick = () => {
  const comment = document.getElementById("problemComment").value.trim();
  if (!comment) return toast("Заполните описание проблемы.");
  postData(`⚠️ <b>ЖАЛОБА / ПРОБЛЕМА</b>\n🏨 <b>Номер комнаты:</b> ${room()}\n🚨 <b>Описание:</b> ${comment}\n🌐 <b>Язык интерфейса:</b> ${currentLang.toUpperCase()}`, comment, () => { document.getElementById("problemComment").value = ""; });
};
document.getElementById("sendOrder").onclick = () => {
  if (!cart.length) return;
  const note = document.getElementById("orderNote").value.trim();
  const list = cart.map(i => `• ${i.name} x${i.qty} — ${(i.price*i.qty).toLocaleString("ru-RU")} UZS`).join("\n");
  const total = cart.reduce((s,i)=>s+i.price*i.qty,0);
  const barOnlyOrder = cart.every(i => BAR.includes(i.cat));
  const head = barOnlyOrder ? "🍸 <b>ЗАКАЗ БАРА</b>" : "🍽️ <b>ЗАКАЗ ЕДЫ</b>";
  const req = `${head}\n🏨 <b>Номер комнаты:</b> ${room()}\n\n<b>Состав заказа:</b>\n${list}\n\n💰 <b>Итого:</b> ${total.toLocaleString("ru-RU")} UZS\n📝 <b>Примечание:</b> ${note || "Без примечания"}\n🌐 <b>Язык интерфейса:</b> ${currentLang.toUpperCase()}`;
  logOrder(total, note);
  postData(req, note, () => { cart = []; document.getElementById("orderNote").value = ""; updateCart(); renderMenu(); });
};

function getRoomFromUrl() {
  if (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) return tg.initDataUnsafe.start_param;
  const q = new URLSearchParams(location.search);
  if (q.get("room")) return q.get("room");
  const h = new URLSearchParams(location.hash.replace(/^#/, ""));
  if (h.get("room")) return h.get("room");
  return "101";
}

const today = new Date().toISOString().slice(0,10);
document.getElementById("alarmDate").value = today;
document.getElementById("taxiDate").value = today;
document.querySelectorAll(".room-number").forEach(n => n.textContent = getRoomFromUrl());
document.documentElement.setAttribute("data-theme", "dark");

fetchMenu();
history.replaceState({appLayer:"root"}, "");
history.pushState({appLayer:"root"}, "");
window.addEventListener("popstate", () => {
  if (document.querySelector(".sheet.open")) { closeSheets(); history.pushState({appLayer:"root"}, ""); return; }
  if (!document.getElementById("menuScreen").classList.contains("hidden")) { showHome(); history.pushState({appLayer:"root"}, ""); return; }
  history.pushState({appLayer:"root"}, "");
});
</script>
