<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
  // Инициализация Telegram WebApp
  const tg = window.Telegram?.WebApp;
  if (tg) tg.ready();

  const WORKER_URL = "https://solitary-frog-ffbc.thetowerroomservice.workers.dev";

  async function sendOrder() {
    const roomNumber = document.getElementById('roomNumber')?.value || 'Не указан';
    
    // Сбор товаров из корзины (замени cartItems на свою переменную корзины, если называется иначе)
    if (!window.cartItems || window.cartItems.length === 0) {
      alert("Корзина пуста!");
      return;
    }

    let itemsText = "";
    let total = 0;

    window.cartItems.forEach((item, index) => {
      const itemTotal = item.price * item.quantity;
      total += itemTotal;
      itemsText += `${index + 1}. ${item.name} x${item.quantity} — ${itemTotal.toLocaleString()} UZS\n`;
    });

    const orderText = `🍽 <b>НОВЫЙ ЗАКАЗ ИЗ МЕНЮ</b>\n🏨 <b>Номер комнаты:</b> ${roomNumber}\n\n📋 <b>Состав заказа:</b>\n${itemsText}\n💰 <b>Итого:</b> ${total.toLocaleString()} UZS\n⏳ <b>Статус:</b> Ожидает доставки`;

    // Данные о пользователе из Telegram
    const username = tg?.initDataUnsafe?.user?.username 
      ? `@${tg.initDataUnsafe.user.username}` 
      : (tg?.initDataUnsafe?.user?.first_name || 'Гость');

    try {
      const response = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          text: orderText,
          username: username
        })
      });

      const result = await response.json();

      if (result.success || result.ok) {
        alert("Заказ успешно отправлен!");
        if (window.cartItems) window.cartItems = []; // Очистка корзины
        if (typeof updateCartUI === "function") updateCartUI(); // Обновление интерфейса корзины
        if (typeof closeModal === "function") closeModal(); // Закрытие модалки
      } else {
        alert("Ошибка при отправке заказа. Попробуйте еще раз.");
      }
    } catch (err) {
      console.error("Fetch Error:", err);
      alert("Ошибка соединения с сервером.");
    }
  }
</script>
